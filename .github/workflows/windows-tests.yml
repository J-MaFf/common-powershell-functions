name: Windows Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Thin caller for the shared reusable lint job (parse-check + PSScriptAnalyzer,
  # Error-severity fail only) — see J-MaFf/.github for the implementation.
  validate:
    uses: J-MaFf/.github/.github/workflows/ps-lint.yml@main
